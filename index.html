<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Money — Personal Finance & Chit Management Platform</title>
  <meta name="description" content="Modern offline-first personal finance app with integrated Chit Fund management, budgets, subscriptions, and Firebase cloud sync.">
  <meta name="theme-color" content="#007AFF">
  
  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.svg">

  <!-- Apple iOS Standalone Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Money">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modules.css">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app-container">
    <!-- iPadOS / macOS Desktop Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">M</div>
        <div class="brand-title">Money</div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <a href="#dashboard" class="nav-item active" data-view="dashboard">
          <span class="nav-item-icon" data-icon="dashboard"></span>
          <span>Dashboard</span>
        </a>
        <a href="#transactions" class="nav-item" data-view="transactions">
          <span class="nav-item-icon" data-icon="transactions"></span>
          <span>Transactions</span>
        </a>
        <a href="#budgets" class="nav-item" data-view="budgets">
          <span class="nav-item-icon" data-icon="budgets"></span>
          <span>Budgets</span>
        </a>
        <a href="#subscriptions" class="nav-item" data-view="subscriptions">
          <span class="nav-item-icon" data-icon="bills"></span>
          <span>Bills & Reminders</span>
        </a>
        <a href="#chits" class="nav-item" data-view="chits">
          <span class="nav-item-icon" data-icon="chits"></span>
          <span>ChitWise</span>
        </a>
        <a href="#calculators" class="nav-item" data-view="calculators">
          <span class="nav-item-icon" data-icon="calculators"></span>
          <span>Chit Calculators</span>
        </a>
        <a href="#analytics" class="nav-item" data-view="analytics">
          <span class="nav-item-icon" data-icon="analytics"></span>
          <span>Analytics</span>
        </a>
        <a href="#reports" class="nav-item" data-view="reports">
          <span class="nav-item-icon" data-icon="reports"></span>
          <span>Reports</span>
        </a>
        <a href="#backup" class="nav-item" data-view="backup">
          <span class="nav-item-icon" data-icon="backup"></span>
          <span>Backup & Sync</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-secondary w-full text-sm" id="theme-toggle-btn" style="width:100%; justify-content: flex-start;">
          <span id="theme-icon" data-icon="moon"></span>
          <span id="theme-text">Dark Mode</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <!-- Top Translucent Header -->
      <header class="top-header">
        <div class="header-left">
          <h1 class="header-title" id="page-title">Dashboard</h1>
        </div>
        <div class="header-right">
          <!-- Global Search Input -->
          <div class="search-wrapper">
            <span class="search-icon" data-icon="search"></span>
            <input type="text" class="search-input" id="global-search-input" placeholder="Search transactions, chits..." aria-label="Search">
          </div>

          <!-- Network Sync Badge -->
          <div class="sync-badge" id="sync-status-badge">
            <span class="sync-status-dot" id="sync-status-dot"></span>
            <span id="sync-status-text">Synced</span>
          </div>

          <!-- Quick Add Button -->
          <button class="btn btn-primary btn-sm btn-icon-text" id="quick-add-btn">
            <span data-icon="plus"></span>
            <span class="hide-mobile">Quick Add</span>
          </button>
        </div>
      </header>

      <!-- Native Mobile Pull-to-Refresh Indicator Container -->
      <div class="pull-to-refresh-container" id="ptr-container">
        <div class="ptr-spinner-box" id="ptr-spinner-box">
          <svg class="ptr-ring-svg" width="26" height="26" viewBox="0 0 32 32" id="ptr-ring-svg">
            <circle class="ptr-ring-bg" cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.15"/>
            <circle class="ptr-ring-stroke" id="ptr-ring-stroke" cx="16" cy="16" r="11" fill="none" stroke="var(--ios-blue)" stroke-width="2.5" stroke-dasharray="69.1" stroke-dashoffset="69.1" stroke-linecap="round" transform="rotate(-90 16 16)"/>
          </svg>
          <div class="ptr-active-spinner" id="ptr-active-spinner" style="display:none;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ios-blue)" stroke-width="2.5" stroke-linecap="round"><path d="M12 2v4"/><path d="M12 18v4"/><path d="m4.93 4.93 2.83 2.83"/><path d="m16.24 16.24 2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="m4.93 19.07 2.83-2.83"/><path d="m16.24 7.76 2.83-2.83"/></svg>
          </div>
        </div>
      </div>

      <!-- Dynamic View Container -->
      <main class="view-container" id="view-container">
        <!-- Dynamic Module Views render here -->
      </main>
    </div>

    <!-- Mobile Bottom Navigation Tab Bar -->
    <nav class="mobile-bottom-nav" id="mobile-nav">
      <button class="mobile-nav-btn active" data-view="dashboard">
        <span class="mobile-nav-icon" data-icon="dashboard"></span>
        <span>Home</span>
      </button>
      <button class="mobile-nav-btn" data-view="transactions">
        <span class="mobile-nav-icon" data-icon="transactions"></span>
        <span>Ledger</span>
      </button>
      <button class="mobile-fab" id="mobile-fab-btn" aria-label="Quick Add">
        <span data-icon="plus"></span>
      </button>
      <button class="mobile-nav-btn" data-view="chits">
        <span class="mobile-nav-icon" data-icon="chits"></span>
        <span>ChitWise</span>
      </button>
      <button class="mobile-nav-btn" data-view="more" id="mobile-more-btn">
        <span class="mobile-nav-icon" data-icon="more"></span>
        <span>More</span>
      </button>
    </nav>
  </div>

  <!-- Reusable Modal Container -->
  <div class="modal-overlay" id="modal-container" role="dialog" aria-hidden="true"></div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Application JS Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
